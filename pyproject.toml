[project]
name = "datara"
version = "0.1.0"
description = "Source-available data analysis tool with AI-powered chat"
requires-python = ">=3.12"
license = "FSL-1.1-MIT"
license-files = ["LICENSE"]
dependencies = []

[project.optional-dependencies]
server = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "aiosqlite>=0.20.0",
    "bcrypt>=4.2.0",
    "charset-normalizer>=3.4.0",
    "httpx>=0.28.0",
    "python-multipart>=0.0.9",
    "openai>=1.55.0",
    "cryptography>=43.0.0",
]
# The desktop application: everything the local server needs, plus the toolkit
# that gives it its own window instead of a browser tab. Kept separate so a
# server-only install never drags a GUI toolkit (and its system libraries) in.
desktop = [
    "datara[hosted]",
    "pywebview>=5.0",
]
hosted = [
    "datara[server]",
    "plotly>=5.24.0",
    "pandas>=2.2.0",
    "openpyxl>=3.1.0",
    "numpy>=2.0.0",
]

[project.scripts]
# `uv run datara` opens the desktop app from the source tree, without packaging.
datara = "server.desktop:main"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pandas>=2.2.0",
    "numpy>=2.0.0",
    "openpyxl>=3.1.0",
    "plotly>=5.24.0",
    # Build-only: turns the app into a frozen binary. 6.21 is the first release
    # that supports Python 3.14, which is what this project's venv runs.
    "pyinstaller>=6.21",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.hatch.build.targets.wheel]
packages = ["core", "server"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
